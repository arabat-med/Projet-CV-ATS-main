name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Projet-Sopra-Steria-main/backend/requirements*.txt
      - run: python -m pip install -r Projet-Sopra-Steria-main/backend/requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projet-Sopra-Steria-main/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: Projet-Sopra-Steria-main/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
