services:
  - type: web
    name: cv-ats-api
    env: python
    buildCommand: pip install -r Projet-Sopra-Steria-main/backend/requirements.txt && python -m spacy download fr_core_news_sm
    startCommand: cd Projet-Sopra-Steria-main/backend && gunicorn -w 4 -b 0.0.0.0:$PORT api:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
